# Railway service config for the RackPatch web application.
# Template marketplace publication still requires the Railway UI workflow + your approval.
# Docs: https://docs.railway.com/

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Run migrations before the new release serves traffic.
preDeployCommand = ["npx", "prisma", "migrate", "deploy"]
healthcheckPath = "/api/ready"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
