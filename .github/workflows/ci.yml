name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rackpatch
          POSTGRES_PASSWORD: rackpatch
          POSTGRES_DB: rackpatch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rackpatch -d rackpatch"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://rackpatch:rackpatch@localhost:5432/rackpatch?schema=public
      BETTER_AUTH_SECRET: ci-test-secret-not-for-production-use-32b
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Prisma migrate
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit / integration tests
        run: npm test

      - name: Production build
        run: npm run build
        env:
          NODE_ENV: production
          ENABLE_DEV_LOGIN: ""
          BETTER_AUTH_SECRET: ci-test-secret-not-for-production-use-32b

      - name: Dependency audit (high+)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
